name: Fetch and Convert AdGuard Mihomo Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/adguard-mihomo.yml"
      - "tools/adguard-mihomo/**"

permissions:
  contents: write

concurrency:
  group: rule-updates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download and Set Up mihomo
        run: |
          VERSION="v1.19.19"
          wget -O mihomo-${VERSION}.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"
          gunzip mihomo-${VERSION}.gz
          chmod +x mihomo-${VERSION}
          sudo mv mihomo-${VERSION} /usr/local/bin/mihomo
          mihomo -v

      - name: Install Dependencies
        working-directory: tools/adguard-mihomo
        run: npm install

      - name: Generate Rules
        working-directory: tools/adguard-mihomo
        run: npm start

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dist/mihomo/
          if ! git diff --staged --quiet; then
            git commit -m 'actions: Update Mihomo rule sets'
            # Retry logic for push
            MAX_RETRIES=10
            for ((i=1; i<=MAX_RETRIES; i++)); do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Push successful"
                exit 0
              fi
              echo "Push failed, retrying ($i/$MAX_RETRIES)..."
              sleep $((RANDOM % 10 + 5))
            done
            echo "Push failed after $MAX_RETRIES attempts"
            exit 1
          else
            echo 'No changes to commit'
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
